<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國中 2000 單字獵人挑戰</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --cambridge-blue: #112b46;
            --pos-color: #0084a8;
            --success: #2ecc71;
            --danger: #e74c3c;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: var(--primary-gradient);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app-container {
            background: rgba(255, 255, 255, 0.98);
            width: 90%;
            max-width: 480px;
            min-height: 600px;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        .hidden { display: none !important; }

        /* 首頁 */
        .main-title { color: var(--cambridge-blue); font-size: 2.5rem; margin-bottom: 5px; }
        .subtitle { color: #666; margin-bottom: 40px; letter-spacing: 2px; }
        .menu-btn {
            width: 100%;
            padding: 20px;
            margin: 10px 0;
            font-size: 1.3rem;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-start { background: var(--cambridge-blue); color: white; }
        .btn-wrong { background: white; border: 3px solid var(--cambridge-blue); color: var(--cambridge-blue); }

        /* 測驗區 */
        .progress-text { font-weight: bold; color: #777; margin-bottom: 10px; }
        .progress-bar { height: 12px; background: #eee; border-radius: 6px; overflow: hidden; margin-bottom: 30px; }
        #fill { height: 100%; background: #3498db; width: 0%; transition: 0.4s; }

        .word-header { text-align: left; margin: 20px 0; padding-left: 15px; border-left: 10px solid var(--pos-color); }
        .en-word { font-size: 3rem; margin: 0; color: var(--cambridge-blue); }
        .pos-tag { color: var(--pos-color); font-style: italic; font-weight: bold; }
        
        .opt-btn {
            width: 100%;
            padding: 18px;
            margin-bottom: 12px;
            font-size: 1.2rem;
            border: 2px solid #ddd;
            border-radius: 15px;
            background: #fff;
            cursor: pointer;
            transition: 0.2s;
        }

        /* 結算畫面 */
        .score-circle {
            width: 150px; height: 150px; border-radius: 50%;
            background: var(--secondary-gradient);
            color: white; font-size: 3rem; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            margin: 30px auto;
        }
        .feedback-msg { font-size: 1.4rem; color: #333; margin-bottom: 30px; line-height: 1.6; }

        .correct { background: var(--success) !important; color: white; border-color: var(--success); }
        .wrong { background: var(--danger) !important; color: white; border-color: var(--danger); }
    </style>
</head>
<body>

<div id="app-container">
    <div id="home-screen">
        <div style="font-size: 5rem;">🏹</div>
        <h1 class="main-title">單字獵人</h1>
        <p class="subtitle">VOCABULARY HUNTER</p>
        <button class="menu-btn btn-start" onclick="startQuiz('normal')">🚀 開始練習 (20題)</button>
        <button class="menu-btn btn-wrong" onclick="startQuiz('review')">📖 錯題本 (<span id="wrong-count">0</span>)</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div class="progress-text" id="q-count">第 1 / 20 題</div>
        <div class="progress-bar"><div id="fill"></div></div>
        
        <div class="word-header">
            <span class="pos-tag" id="word-pos">adj.</span>
            <h1 class="en-word" id="word-en">Word</h1>
            <div style="display:flex; align-items:center; gap:10px; margin-top:10px;">
                <span id="word-kk" style="color:#666;">/kk/</span>
                <button onclick="speakWord()" style="background:none; border:none; cursor:pointer;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="#3498db"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                </button>
            </div>
        </div>

        <div id="options-box"></div>
    </div>

    <div id="result-screen" class="hidden">
        <h1 style="color: var(--cambridge-blue);">練習完成！</h1>
        <div class="score-circle" id="final-score">0</div>
        <div class="feedback-msg" id="feedback-text">太棒了！</div>
        <button class="menu-btn btn-start" onclick="goHome()">回首頁</button>
    </div>
</div>

<script>
    [cite_start]// 單字資料庫 (整理自 PDF) [cite: 1]
    const rawData = [
        { en: "able", pos: "adj.", ch: "有能力的", kk: "/ˈebl/" },
        { en: "about", pos: "prep.", ch: "有關", kk: "/əˈbaʊt/" },
        { en: "above", pos: "adv.", ch: "在上方", kk: "/əˈbʌv/" },
        { en: "abroad", pos: "adv.", ch: "在國外", kk: "/əˈbrɔːd/" },
        { en: "absent", pos: "adj.", ch: "缺席的", kk: "/ˈæbsənt/" },
        { en: "accept", pos: "v.", ch: "接受", kk: "/əkˈsept/" },
        { en: "accident", pos: "n.", ch: "意外", kk: "/ˈæksɪdənt/" },
        { en: "across", pos: "prep.", ch: "在...對面", kk: "/əˈkrɔːs/" },
        { en: "active", pos: "adj.", ch: "積極的", kk: "/ˈæktɪv/" },
        { en: "actually", pos: "adv.", ch: "確實", kk: "/ˈæktʃuəli/" },
        { en: "admire", pos: "v.", ch: "欽佩", kk: "/ədˈmaɪər/" },
        { en: "advice", pos: "n.", ch: "勸告", kk: "/ədˈvaɪs/" },
        { en: "affect", pos: "v.", ch: "影響", kk: "/əˈfekt/" },
        { en: "afraid", pos: "adj.", ch: "害怕的", kk: "/əˈfreɪd/" },
        { en: "alive", pos: "adj.", ch: "活的", kk: "/əˈlaɪv/" },
        { en: "allow", pos: "v.", ch: "允許", kk: "/əˈlaʊ/" },
        { en: "ancient", pos: "adj.", ch: "古代的", kk: "/ˈeɪnʃənt/" },
        { en: "available", pos: "adj.", ch: "可獲得的", kk: "/əˈveɪləbl/" },
        { en: "avoid", pos: "v.", ch: "避免", kk: "/əˈvɔɪd/" },
        { en: "bakery", pos: "n.", ch: "麵包店", kk: "/ˈbeɪkəri/" }
    ];

    let wrongWords = JSON.parse(localStorage.getItem('wrongWords')) || [];
    let currentPool = [];
    let currentIndex = 0;
    let correctCount = 0;
    let currentItem = {};

    function startQuiz(mode) {
        currentIndex = 0;
        correctCount = 0;
        if (mode === 'normal') {
            currentPool = [...rawData].sort(() => Math.random() - 0.5).slice(0, 20);
        } else {
            if (wrongWords.length === 0) return alert("錯題本目前是空的唷！");
            currentPool = [...wrongWords].sort(() => Math.random() - 0.5);
        }
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        if (currentIndex >= currentPool.length) return showResult();

        currentItem = currentPool[currentIndex];
        document.getElementById('q-count').innerText = `第 ${currentIndex + 1} / ${currentPool.length} 題`;
        document.getElementById('fill').style.width = `${((currentIndex + 1) / currentPool.length) * 100}%`;
        document.getElementById('word-en').innerText = currentItem.en;
        document.getElementById('word-pos').innerText = currentItem.pos;
        document.getElementById('word-kk').innerText = currentItem.kk;

        let wrongOpt;
        do {
            wrongOpt = rawData[Math.floor(Math.random() * rawData.length)].ch;
        } while (wrongOpt === currentItem.ch);

        const opts = [currentItem.ch, wrongOpt].sort(() => Math.random() - 0.5);
        const box = document.getElementById('options-box');
        box.innerHTML = '';
        opts.forEach(o => {
            const b = document.createElement('button');
            b.className = 'opt-btn';
            b.innerText = o;
            b.onclick = () => check(b, o);
            box.appendChild(b);
        });
        speakWord();
    }

    function check(btn, val) {
        document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
        if (val === currentItem.ch) {
            btn.classList.add('correct');
            correctCount++;
            if (currentPool === wrongWords) { // 錯題模式答對則移除
                wrongWords = wrongWords.filter(w => w.en !== currentItem.en);
            }
        } else {
            btn.classList.add('wrong');
            document.querySelectorAll('.opt-btn').forEach(b => {
                if(b.innerText === currentItem.ch) b.classList.add('correct');
            });
            if(!wrongWords.find(w => w.en === currentItem.en)) wrongWords.push(currentItem);
        }
        localStorage.setItem('wrongWords', JSON.stringify(wrongWords));
        setTimeout(() => { currentIndex++; showQuestion(); }, 1200);
    }

    function showResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        
        const totalScore = Math.round((correctCount / currentPool.length) * 100);
        document.getElementById('final-score').innerText = totalScore;
        
        let msg = "";
        if (totalScore === 100) msg = "🎯 完美獵人！你已經完全掌握這些單字了！";
        else if (totalScore >= 80) msg = "🔥 太強了！你離單字大師只差一步！";
        else if (totalScore >= 60) msg = "👍 不錯喔！繼續保持練習，你會越來越棒！";
        else msg = "🏹 獵人還在磨練中！多看錯題本，下次一定會進步！";
        
        document.getElementById('feedback-text').innerText = msg;
    }

    function speakWord() {
        const u = new SpeechSynthesisUtterance(currentItem.en);
        u.lang = 'en-US';
        window.speechSynthesis.speak(u);
    }

    function goHome() {
        document.getElementById('home-screen').classList.remove('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('wrong-count').innerText = wrongWords.length;
    }

    goHome();
</script>
</body>
</html>
