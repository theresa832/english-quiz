<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國中 2000 單字 - 獵人記憶系統</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
            --bg: #f4f7f6;
        }
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #app {
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        #progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s;
            border-radius: 4px;
        }
        #word-card { margin: 30px 0; }
        .en-word { font-size: 2.8rem; font-weight: bold; color: var(--primary); margin: 0; }
        .phonetic { font-size: 1.2rem; color: #7f8c8d; margin: 5px 0; font-family: 'Arial'; }
        .part-of-speech { 
            display: inline-block;
            padding: 2px 8px;
            background: #ecf0f1;
            border-radius: 5px;
            font-size: 0.9rem;
            color: #34495e;
        }
        .options { display: grid; gap: 12px; margin-top: 30px; }
        button {
            padding: 16px;
            font-size: 1.1rem;
            border: 2px solid #ddd;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:active { transform: scale(0.98); }
        .correct { background: var(--success) !important; color: white; border-color: var(--success); }
        .wrong { background: var(--danger) !important; color: white; border-color: var(--danger); }
        #stats { margin-top: 20px; font-size: 0.9rem; color: #95a5a6; }
    </style>
</head>
<body>

<div id="app">
    <div class="progress-bar"><div id="progress-fill"></div></div>
    <div id="stats">已完成: <span id="count">0</span> / 20</div>
    
    <div id="word-card">
        <div class="part-of-speech" id="pos">pos</div>
        <div class="en-word" id="en">Word</div>
        <div class="phonetic" id="kk">/phonetic/</div>
    </div>

    <div class="options" id="options">
        </div>
</div>

<script>
    // 資料庫：包含 KK 音標與詞性 (依據附件內容擴充)
    const rawData = [
        { en: "able", kk: "[ˈebl]", pos: "adj.", ch: "有能力的" },
        { en: "absent", kk: "[ˈæbsnt]", pos: "adj.", ch: "缺席的" },
        { en: "accept", kk: "[əkˈsɛpt]", pos: "v.", ch: "接受" },
        { en: "accident", kk: "[ˈæksədənt]", pos: "n.", ch: "意外" },
        { en: "across", kk: "[əˈkrɔs]", pos: "prep.", ch: "在...對面" },
        { en: "active", kk: "[ˈæktɪv]", pos: "adj.", ch: "積極的" },
        { en: "admire", kk: "[ədˈmaɪr]", pos: "v.", ch: "欽佩" },
        { en: "advice", kk: "[ədˈvaɪs]", pos: "n.", ch: "勸告" },
        { en: "affect", kk: "[əˈfɛkt]", pos: "v.", ch: "影響" },
        { en: "afraid", kk: "[əˈfred]", pos: "adj.", ch: "害怕的" },
        { en: "agree", kk: "[əˈɡri]", pos: "v.", ch: "同意" },
        { en: "alive", kk: "[əˈlaɪv]", pos: "adj.", ch: "活的" },
        { en: "allow", kk: "[əˈlaʊ]", pos: "v.", ch: "允許" },
        { en: "ancient", kk: "[ˈenʃənt]", pos: "adj.", ch: "古代的" },
        { en: "available", kk: "[əˈveləbl]", pos: "adj.", ch: "可獲得的" },
        { en: "avoid", kk: "[əˈvɔɪd]", pos: "v.", ch: "避免" },
        { en: "believe", kk: "[bɪˈliv]", pos: "v.", ch: "相信" },
        { en: "beyond", kk: "[bɪˈjɑnd]", pos: "prep.", ch: "超出" },
        { en: "careful", kk: "[ˈkɛrfəl]", pos: "adj.", ch: "小心的" },
        { en: "certain", kk: "[ˈsɝtn]", pos: "adj.", ch: "肯定的" }
    ];

    let quizPool = [...rawData].sort(() => Math.random() - 0.5).slice(0, 20); // 隨機抽 20 題
    let reviewQueue = []; // 遺忘曲線：存放答錯的題目
    let currentIndex = 0;
    let finishedCount = 0;
    let currentItem = {};

    function initQuiz() {
        if (currentIndex < quizPool.length) {
            currentItem = quizPool[currentIndex];
        } else if (reviewQueue.length > 0) {
            // 進入遺忘曲線回訪：從錯題中隨機抽一題
            currentItem = reviewQueue.shift();
        } else {
            alert("恭喜完成本次 20 題訓練！");
            location.reload();
            return;
        }
        renderCard();
    }

    function renderCard() {
        document.getElementById('en').innerText = currentItem.en;
        document.getElementById('kk').innerText = currentItem.kk;
        document.getElementById('pos').innerText = currentItem.pos;
        
        // 生成選項
        let wrongOpt;
        do {
            wrongOpt = rawData[Math.floor(Math.random() * rawData.length)].ch;
        } while (wrongOpt === currentItem.ch);

        const options = [currentItem.ch, wrongOpt].sort(() => Math.random() - 0.5);
        const container = document.getElementById('options');
        container.innerHTML = '';

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.onclick = () => handleAnswer(btn, opt);
            container.appendChild(btn);
        });

        // 更新進度條 (以 20 題為基準)
        const progress = (finishedCount / 20) * 100;
        document.getElementById('progress-fill').style.width = `${Math.min(progress, 100)}%`;
        document.getElementById('count').innerText = finishedCount;
    }

    function handleAnswer(btn, selected) {
        const isCorrect = (selected === currentItem.ch);
        const allBtns = document.querySelectorAll('button');
        allBtns.forEach(b => b.disabled = true);

        if (isCorrect) {
            btn.classList.add('correct');
            // 如果是從正常題庫答對的，增加計數
            if (currentIndex < quizPool.length && quizPool[currentIndex] === currentItem) {
                currentIndex++;
                finishedCount++;
            }
        } else {
            btn.classList.add('wrong');
            // 顯示正確答案
            allBtns.forEach(b => { if(b.innerText === currentItem.ch) b.classList.add('correct'); });
            
            // 語林獵人邏輯：答錯的單字丟進 reviewQueue 末端，稍後再次出現
            if (!reviewQueue.includes(currentItem)) {
                reviewQueue.push(currentItem);
            }
        }

        setTimeout(initQuiz, 1200);
    }

    initQuiz();
</script>

</body>
</html>
