<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國中 2000 單字挑戰</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #quiz-container {
            background-color: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h1 { color: #2c3e50; font-size: 1.5rem; }
        #word-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: #3498db;
            margin: 20px 0;
        }
        .options {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }
        button {
            padding: 15px;
            font-size: 1.2rem;
            border: 2px solid #3498db;
            background-color: white;
            color: #3498db;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background-color: #3498db;
            color: white;
        }
        button.correct {
            background-color: #2ecc71 !important;
            border-color: #2ecc71 !important;
            color: white !important;
        }
        button.wrong {
            background-color: #e74c3c !important;
            border-color: #e74c3c !important;
            color: white !important;
        }
        #score {
            margin-top: 20px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<div id="quiz-container">
    <h1>單字記憶挑戰</h1>
    <div id="word-display">Loading...</div>
    <div class="options" id="options-container">
        </div>
    <div id="score">分數: <span id="current-score">0</span></div>
</div>

<script>
    // 從附件中提取的部分單字範例 [cite: 1, 3, 16]
    const wordList = [
        { en: "able", ch: "有能力的" },
        { en: "absent", ch: "缺席的" },
        { en: "accept", ch: "接受" },
        { en: "accident", ch: "意外" },
        { en: "active", ch: "積極的" },
        { en: "actually", ch: "確實" },
        { en: "admire", ch: "欽佩" },
        { en: "advice", ch: "勸告" },
        { en: "affect", ch: "影響" },
        { en: "afraid", ch: "害怕的" },
        { en: "agree", ch: "同意" },
        { en: "alive", ch: "活的" },
        { en: "allow", ch: "允許" },
        { en: "ancient", ch: "古代的" },
        { en: "available", ch: "可獲得的" },
        { en: "avoid", ch: "避免" },
        { en: "bakery", ch: "麵包店" },
        { en: "believe", ch: "相信" },
        { en: "beyond", ch: "超出" },
        { en: "careful", ch: "小心的" }
    ];

    let score = 0;
    let currentWord = {};

    function nextQuestion() {
        // 隨機選一個字
        const randomIndex = Math.floor(Math.random() * wordList.length);
        currentWord = wordList[randomIndex];
        
        // 隨機選一個錯誤答案
        let wrongAnswer;
        do {
            wrongAnswer = wordList[Math.floor(Math.random() * wordList.length)].ch;
        } while (wrongAnswer === currentWord.ch);

        // 隨機排列正確與錯誤選項
        const options = [currentWord.ch, wrongAnswer].sort(() => Math.random() - 0.5);

        // 顯示到網頁
        document.getElementById('word-display').innerText = currentWord.en;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt);
            container.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, selectedOpt) {
        const buttons = document.querySelectorAll('button');
        buttons.forEach(b => b.disabled = true); // 防止重複點擊

        if (selectedOpt === currentWord.ch) {
            selectedBtn.classList.add('correct');
            score++;
            document.getElementById('current-score').innerText = score;
        } else {
            selectedBtn.classList.add('wrong');
            // 顯示正確答案
            buttons.forEach(b => {
                if (b.innerText === currentWord.ch) b.classList.add('correct');
            });
        }

        // 1.5 秒後下一題
        setTimeout(nextQuestion, 1500);
    }

    // 初始化啟動
    nextQuestion();
</script>

</body>
</html>
